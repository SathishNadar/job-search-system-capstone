# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=employer-service
server.port=8081

# ===================================================================
# Database Configuration (In-Memory H2 for Instant Zero-Setup Run)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:employerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Swagger / OpenAPI Documentation Configuration
# Swagger UI available at: http://localhost:8081/swagger-ui.html
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

