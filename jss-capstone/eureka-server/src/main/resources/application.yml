server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # Do not register the Eureka Server with itself as a client
    register-with-eureka: false
    # Do not fetch the registry from itself
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # Interval to check for expired instances (default is 60s)
    eviction-interval-timer-in-ms: 60000
