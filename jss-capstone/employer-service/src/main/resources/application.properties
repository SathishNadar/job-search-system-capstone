# ==============================================================================
# Job Search System (JSS) - Employer Microservice Configuration
# ==============================================================================

# Server Port & Application Name (Used by Eureka)
server.port=8082
spring.application.name=employer-service

# ==============================================================================
# Database Configuration: Local MySQL (employer_db)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/employer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# Eureka Service Discovery Client
# Registers this instance dynamically with the Eureka Server running on port 8761
# we use (eureka.instance.prefer-ip-address=true) else Eureka registers services using your machine's Operating System Hostname
# ==============================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true 
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# ==============================================================================
# Springdoc OpenAPI 3 (Swagger UI) Configuration
# Swagger UI URL: http://localhost:8082/swagger-ui.html
# OpenAPI Docs:   http://localhost:8082/api-docs
# ==============================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs 
